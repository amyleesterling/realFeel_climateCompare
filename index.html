<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RealFeel Climate Compare</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <h1>RealFeel Climate Compare</h1>
    <p class="subtitle">Compare 20 years of climate data between any two locations</p>
  </header>

  <main>
    <section class="search-section">
      <div class="search-row">
        <div class="search-group location-1">
          <label for="search1">Location 1</label>
          <div class="search-wrapper">
            <input type="text" id="search1" placeholder="Search city..." autocomplete="off">
            <div class="dropdown" id="dropdown1"></div>
          </div>
          <span class="selected-label" id="selected1"></span>
        </div>

        <div class="vs-badge">VS</div>

        <div class="search-group location-2">
          <label for="search2">Location 2</label>
          <div class="search-wrapper">
            <input type="text" id="search2" placeholder="Search city..." autocomplete="off">
            <div class="dropdown" id="dropdown2"></div>
          </div>
          <span class="selected-label" id="selected2"></span>
        </div>
      </div>

      <button id="compareBtn" disabled>Compare Climates</button>
    </section>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>Fetching 20 years of climate data...</p>
    </div>

    <div id="error" class="error-message hidden"></div>

    <section id="results" class="results hidden">
      <h2 class="results-title">
        <span class="loc1-name"></span> vs <span class="loc2-name"></span>
      </h2>
      <p class="results-subtitle">20-Year Climate Averages (2006 &ndash; 2026)</p>

      <div class="cards-grid" id="cardsGrid"></div>

      <h3 class="section-heading">Monthly Breakdown</h3>
      <div class="charts-grid">
        <div class="chart-card"><canvas id="chartTemp"></canvas></div>
        <div class="chart-card"><canvas id="chartRealFeel"></canvas></div>
        <div class="chart-card"><canvas id="chartPrecip"></canvas></div>
        <div class="chart-card"><canvas id="chartSunshine"></canvas></div>
        <div class="chart-card"><canvas id="chartWind"></canvas></div>
      </div>
    </section>
  </main>

  <footer>
    <p>Data provided by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> | Historical weather data 2006&ndash;2026</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
